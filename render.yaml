# Render blueprint: NestJS API (web service) + React app (static site)
# + Key Value (Redis) for caching and shared rate-limit counters.
# The database lives on Neon and is wired in via DATABASE_URL.
keyValues:
  - name: mediumclone-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal connections only

services:
  - type: web
    name: mediumclone-api
    runtime: node
    plan: free
    # --include=dev: NODE_ENV=production makes npm ci skip the devDependencies
    # that the build itself needs (@nestjs/cli, typescript).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste the Neon connection string in the dashboard
      - key: DB_SSL
        value: "true"
      - key: MIGRATIONS_RUN
        value: "true" # apply pending migrations on boot
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        value: https://mediumclone-frontend.onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mediumclone-redis
          property: connectionString

  - type: web
    name: mediumclone-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback: let React Router handle client-side routes.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mediumclone-api.onrender.com
